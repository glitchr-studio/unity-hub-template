# Publishes the hub on GitHub Pages: on a push, every hour (a package's new release), by hand, or
# when a package's release workflow says so (repository_dispatch "package-released").
# Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish the hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress
      # GitHub's answers (their ETags) kept between builds: a 304 costs nothing of the rate limit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .omnihub
          key: omnihub-github-${{ github.run_id }}
          restore-keys: omnihub-github-
      - name: Build the hub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A repository variable: true resolves the "github" sources now (public repositories only).
          RESOLVE_GITHUB: ${{ vars.HUB_RESOLVE_GITHUB }}
        run: |
          owner="${{ github.repository_owner }}"
          name="${{ github.event.repository.name }}"
          # <owner>.github.io is served at the root; any other repository under its name.
          if [ "$name" = "$owner.github.io" ]; then url="https://$owner.github.io"; else url="https://$owner.github.io/$name"; fi
          vendor/bin/omnihub check hub.yaml --url="$url"
          resolve=""
          if [ "$RESOLVE_GITHUB" = "true" ]; then resolve="--resolve-github --github-cache=.omnihub/github.json"; fi
          vendor/bin/omnihub build hub.yaml _site --url="$url" $resolve
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
